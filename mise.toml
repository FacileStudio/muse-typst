[tools]
typst = "0.15.1"

[tasks.build]
description = "Compile example Typst document"
run = "typst compile --root . examples/example.typ examples/example.pdf"

[tasks.watch]
description = "Watch and live compile example Typst document"
run = "typst watch --root . examples/example.typ examples/example.pdf"

[tasks.test]
description = "Compile the footer test document with the default, a custom and no footer"
run = "for m in default custom none; do typst compile --root . --input footer=$m tests/footer.typ /tmp/muse-typst-footer-$m.pdf; done"
